services:
  # ==============================================================================
  # 1. SERVEURS DE CONFIGURATION (Config Servers Replica Set : rs-config)
  # ==============================================================================
  configsvr1:
    image: mongo:7.0
    container_name: luke_configsvr1
    command: mongod --configsvr --replSet rs-config --port 27017 --bind_ip_all
    volumes:
      - cfg1_data:/data/db
    networks:
      - luke_network
    restart: unless-stopped

  configsvr2:
    image: mongo:7.0
    container_name: luke_configsvr2
    command: mongod --configsvr --replSet rs-config --port 27017 --bind_ip_all
    volumes:
      - cfg2_data:/data/db
    networks:
      - luke_network
    restart: unless-stopped

  configsvr3:
    image: mongo:7.0
    container_name: luke_configsvr3
    command: mongod --configsvr --replSet rs-config --port 27017 --bind_ip_all
    volumes:
      - cfg3_data:/data/db
    networks:
      - luke_network
    restart: unless-stopped

  # ==============================================================================
  # 2. SHARD 1 (Replica Set Haute Disponibilité : rs-shard1)
  # ==============================================================================
  shard1a:
    image: mongo:7.0
    container_name: luke_shard1a
    command: mongod --shardsvr --replSet rs-shard1 --port 27017 --bind_ip_all
    volumes:
      - shard1a_data:/data/db
    networks:
      - luke_network
    restart: unless-stopped

  shard1b:
    image: mongo:7.0
    container_name: luke_shard1b
    command: mongod --shardsvr --replSet rs-shard1 --port 27017 --bind_ip_all
    volumes:
      - shard1b_data:/data/db
    networks:
      - luke_network
    restart: unless-stopped

  shard1c:
    image: mongo:7.0
    container_name: luke_shard1c
    command: mongod --shardsvr --replSet rs-shard1 --port 27017 --bind_ip_all
    volumes:
      - shard1c_data:/data/db
    networks:
      - luke_network
    restart: unless-stopped

  # ==============================================================================
  # 3. SHARD 2 (Replica Set Haute Disponibilité : rs-shard2)
  # ==============================================================================
  shard2a:
    image: mongo:7.0
    container_name: luke_shard2a
    command: mongod --shardsvr --replSet rs-shard2 --port 27017 --bind_ip_all
    volumes:
      - shard2a_data:/data/db
    networks:
      - luke_network
    restart: unless-stopped

  shard2b:
    image: mongo:7.0
    container_name: luke_shard2b
    command: mongod --shardsvr --replSet rs-shard2 --port 27017 --bind_ip_all
    volumes:
      - shard2b_data:/data/db
    networks:
      - luke_network
    restart: unless-stopped

  shard2c:
    image: mongo:7.0
    container_name: luke_shard2c
    command: mongod --shardsvr --replSet rs-shard2 --port 27017 --bind_ip_all
    volumes:
      - shard2c_data:/data/db
    networks:
      - luke_network
    restart: unless-stopped

  # ==============================================================================
  # 4. ROUTEUR MONGOS (Point d'Entrée Unique du Cluster Distribué)
  # ==============================================================================
  mongos:
    image: mongo:7.0
    container_name: luke_mongos
    command: mongos --configdb rs-config/configsvr1:27017,configsvr2:27017,configsvr3:27017 --bind_ip_all --port 27017
    ports:
      - "27017:27017"
    networks:
      - luke_network
    depends_on:
      - configsvr1
      - configsvr2
      - configsvr3
    restart: unless-stopped

  # ==============================================================================
  # 5. INITIALISATION AUTOMATIQUE DU CLUSTER & SHARDING (One-shot)
  # ==============================================================================
  cluster-init:
    image: mongo:7.0
    container_name: luke_cluster_init
    volumes:
      - ./scripts/cluster-init:/scripts:ro
    entrypoint: ["bash", "/scripts/init-cluster.sh"]
    networks:
      - luke_network
    depends_on:
      - configsvr1
      - configsvr2
      - configsvr3
      - shard1a
      - shard1b
      - shard1c
      - shard2a
      - shard2b
      - shard2c
      - mongos
    restart: "no"

  # ==============================================================================
  # 6. APPLICATION BACKEND FASTAPI
  # ==============================================================================
  backend:
    build: .
    container_name: luke_backend
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongos:27017/luke_db?retryWrites=true&w=majority}
    volumes:
      - .:/app
    networks:
      - luke_network
    depends_on:
      cluster-init:
        condition: service_completed_successfully
    restart: unless-stopped

networks:
  luke_network:
    driver: bridge

volumes:
  cfg1_data:
  cfg2_data:
  cfg3_data:
  shard1a_data:
  shard1b_data:
  shard1c_data:
  shard2a_data:
  shard2b_data:
  shard2c_data:

services:
  mongodb:
    image: mongo:7.0
    container_name: luke_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - luke-network
    restart: always

  backend:
    build: .
    container_name: luke_backend
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/luke_db
    depends_on:
      - mongodb
    networks:
      - luke-network
    restart: always

volumes:
  mongodb_data:

networks:
  luke-network:
    driver: bridge
